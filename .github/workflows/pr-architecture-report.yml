name: PR architecture report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  architecture-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzer dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate HTML architecture report
        run: >-
          python local_pr_review.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          --output artifacts/changes.md
          --html-output artifacts/changes.html

      - name: Upload changes.html
        uses: actions/upload-artifact@v4
        with:
          name: pr-architecture-report
          path: artifacts/
          if-no-files-found: error