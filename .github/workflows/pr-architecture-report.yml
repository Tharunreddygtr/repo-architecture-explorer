name: PR architecture report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  architecture-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analyzer dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate HTML architecture report
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          python local_pr_review.py "$BASE" "$HEAD"
          --output artifacts/changes.md
          --html-output artifacts/changes.html
          --pr-number "$PR_NUMBER"
          --pr-title "$PR_TITLE"
          --pr-author "$PR_AUTHOR"
          --pr-url "$PR_URL"

      - name: Upload changes.html
        uses: actions/upload-artifact@v5
        with:
          name: pr-architecture-report
          path: artifacts/
          if-no-files-found: error