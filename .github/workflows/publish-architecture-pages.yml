name: Publish architecture reports to Pages

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to publish, for example 123
        required: false
        type: string
      base:
        description: Base commit, branch, or tag
        required: false
        type: string
      head:
        description: Head commit, branch, or tag
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: architecture-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analyzer from the base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analyzer dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve report commits
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr_number="$EVENT_PR"
          base="$EVENT_BASE"
          head="$EVENT_HEAD"
          if [ -z "$pr_number" ]; then pr_number="$INPUT_PR"; fi
          if [ -n "$INPUT_BASE" ]; then base="$INPUT_BASE"; fi
          if [ -n "$INPUT_HEAD" ]; then head="$INPUT_HEAD"; fi

          if [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
          fi

          if [ -n "$pr_number" ]; then
            git fetch origin "refs/pull/$pr_number/head:refs/remotes/origin/pr/$pr_number"
            if [ -z "$head" ]; then head="refs/remotes/origin/pr/$pr_number"; fi
          fi
          if [ -z "$head" ]; then head="$PUSH_HEAD"; fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="$(git rev-parse "$head^1")"
          fi

          {
            echo "base=$base"
            echo "head=$head"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Generate report
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
          PR_NUMBER: ${{ steps.commits.outputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            report_dir="/tmp/report/pr/$PR_NUMBER"
          else
            report_dir="/tmp/report"
          fi
          mkdir -p "$report_dir"
          python local_pr_review.py "$BASE" "$HEAD" \
            --output "$report_dir/changes.md" \
            --html-output "$report_dir/index.html" \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --pr-url "$PR_URL"

      - name: Update gh-pages branch
        env:
          PR_NUMBER: ${{ steps.commits.outputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add /tmp/pages-site origin/gh-pages
          else
            mkdir /tmp/pages-site
            git -C /tmp/pages-site init
            git -C /tmp/pages-site checkout --orphan gh-pages
            git -C /tmp/pages-site remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          if [ -n "$PR_NUMBER" ]; then
            mkdir -p "/tmp/pages-site/pr/$PR_NUMBER"
            cp "/tmp/report/pr/$PR_NUMBER/"* "/tmp/pages-site/pr/$PR_NUMBER/"
          else
            cp /tmp/report/* /tmp/pages-site/
          fi

          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/pages-site')
          report_root = root / 'pr'
          links = []
          if report_root.exists():
              reports = sorted(report_root.glob('*/index.html'), key=lambda item: int(item.parent.name))
              links = [f'<li><a href="pr/{item.parent.name}/">PR #{item.parent.name}</a></li>' for item in reports]
          if links or not (root / 'index.html').exists():
              index = '<!doctype html><meta charset="utf-8"><title>Architecture PR Reports</title><h1>Architecture PR Reports</h1><ul>' + ''.join(links) + '</ul>'
              (root / 'index.html').write_text(index, encoding='utf-8')
          PY

          git -C /tmp/pages-site config user.name github-actions[bot]
          git -C /tmp/pages-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/pages-site add .
          git -C /tmp/pages-site commit -m "Publish architecture report" || true
          git -C /tmp/pages-site push origin HEAD:gh-pages
