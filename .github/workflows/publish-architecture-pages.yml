name: Publish architecture reports to Pages

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to publish, for example 123
        required: false
        type: string
      base:
        description: Base commit, branch, or tag
        required: false
        type: string
      head:
        description: Head commit, branch, or tag
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: architecture-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out analyzer from the base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analyzer dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve report commits
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_HEAD: ${{ inputs.head }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr_number="$EVENT_PR"
          base="$EVENT_BASE"
          head="$EVENT_HEAD"
          if [ -z "$pr_number" ]; then pr_number="$INPUT_PR"; fi
          if [ -n "$INPUT_BASE" ]; then base="$INPUT_BASE"; fi
          if [ -n "$INPUT_HEAD" ]; then head="$INPUT_HEAD"; fi

          if [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
          fi

          if [ -n "$pr_number" ]; then
            git fetch origin "refs/pull/$pr_number/head:refs/remotes/origin/pr/$pr_number"
            if [ -z "$head" ]; then head="refs/remotes/origin/pr/$pr_number"; fi
          fi
          if [ -z "$head" ]; then head="$PUSH_HEAD"; fi
          if [ -z "$base" ] || printf '%s' "$base" | grep -Eq '^0+$'; then
            base="$(git rev-parse "$head^1")"
          fi

          {
            echo "base=$base"
            echo "head=$head"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

      - name: Generate report
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
          PR_NUMBER: ${{ steps.commits.outputs.pr_number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            report_dir="/tmp/report/pr/$PR_NUMBER"
          else
            report_dir="/tmp/report"
          fi
          mkdir -p "$report_dir"
          python local_pr_review.py "$BASE" "$HEAD" \
            --output "$report_dir/changes.md" \
            --html-output "$report_dir/index.html" \
            --pr-number "$PR_NUMBER" \
            --pr-title "$PR_TITLE" \
            --pr-author "$PR_AUTHOR" \
            --pr-url "$PR_URL"

      - name: Update gh-pages branch
        env:
          PR_NUMBER: ${{ steps.commits.outputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add /tmp/pages-site origin/gh-pages
          else
            mkdir /tmp/pages-site
            git -C /tmp/pages-site init
            git -C /tmp/pages-site checkout --orphan gh-pages
            git -C /tmp/pages-site remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          if [ -n "$PR_NUMBER" ]; then
            mkdir -p "/tmp/pages-site/pr/$PR_NUMBER"
            cp "/tmp/report/pr/$PR_NUMBER/"* "/tmp/pages-site/pr/$PR_NUMBER/"
          else
            cp /tmp/report/* /tmp/pages-site/
          fi

          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/pages-site')
          report_root = root / 'pr'
          links = []
          if report_root.exists():
              reports = sorted(report_root.glob('*/index.html'), key=lambda item: int(item.parent.name))
              links = [f'<li><a href="pr/{item.parent.name}/">PR #{item.parent.name}</a></li>' for item in reports]
          if links:
              index = '<!doctype html><meta charset="utf-8"><title>Architecture PR Reports</title><h1>Architecture PR Reports</h1><ul>' + ''.join(links) + '</ul>'
              (root / 'prs.html').write_text(index, encoding='utf-8')
          PY

          git -C /tmp/pages-site config user.name github-actions[bot]
          git -C /tmp/pages-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C /tmp/pages-site add .
          git -C /tmp/pages-site commit -m "Publish architecture report" || true
          git -C /tmp/pages-site push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

  comment:
    needs: publish
    if: needs.publish.outputs.pr_number != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    continue-on-error: true
    steps:
      - name: Add report link to pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          owner, name = repository.split("/", 1)
          report_url = f"https://{owner}.github.io/{name}/pr/{pr_number}/"
          marker = "<!-- architecture-report-link -->"
          body = f"{marker}\n### Architecture report\n[Open the visual architecture report for PR #{pr_number}]({report_url})"
          api_url = f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # Use PR comments endpoint (not issues) for PR comments
          api_url = f"https://api.github.com/repos/{repository}/pulls/{pr_number}/comments"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          try:
              request = Request(api_url, headers=headers)
              with urlopen(request) as response:
                  comments = json.load(response)
              existing = next((comment for comment in comments if marker in comment.get("body", "")), None)
              if existing:
                  update_url = existing["url"]
                  update = Request(update_url, data=json.dumps({"body": body}).encode(), headers=headers, method="PATCH")
                  with urlopen(update):
                      pass
              else:
                  create = Request(api_url, data=json.dumps({"body": body}).encode(), headers=headers, method="POST")
                  with urlopen(create):
                      pass
          except Exception as error:
              error_msg = str(error)
              if "403" in error_msg:
                  print(f"::warning::PR comment failed (403 Forbidden). Fix: Repository Settings > Actions > General > Workflow permissions > Enable 'Read and write permissions' and 'Allow GitHub Actions to create and approve pull requests'")
              else:
                  print(f"::warning::Could not add architecture report comment: {error}")
          PY
